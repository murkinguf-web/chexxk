// Creates the chexxk admin account. Needs the setup passcode, and works only once.
async function setupFlow() {
  const err = $('auth-error');
  err.textContent = '';
  if (api.findAccount(ADMIN_USERNAME)) { err.textContent = 'The chexxk account already exists. Log in instead.'; return; }
  const key = 'setup';
  const mins = lockedMinutes(key);
  if (mins) { err.textContent = `Too many attempts. Try again in ${mins} min.`; return; }
  const pass = $('setup-pass').value;
  const email = $('setup-email').value.trim().toLowerCase();
  const pw = $('setup-password').value;
  const pw2 = $('setup-confirm').value;
  if (pass !== CONFIG.adminPasscode) {
    recordFail(key);
    const left = lockedMinutes(key);
    err.textContent = left ? `Too many attempts. Try again in ${left} min.` : 'Wrong setup passcode.';
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
  if (api.emailTaken(email)) { err.textContent = 'That email already has an account.'; return; }
  if (pw.length < 8) { err.textContent = 'Your password needs at least 8 characters.'; return; }
  if (pw !== pw2) { err.textContent = "Passwords don't match."; return; }
  clearFails(key);
  const btn = $('setup-go');
  if (btn) btn.disabled = true;
  try {
    const code = newRecoveryCode();
    const pwRec = await hashSecret(pw);
    const recRec = await hashSecret(code.replace(/-/g, ''));
    api.saveAccounts([...api.listAccounts(), {
      username: ADMIN_USERNAME, email, pw: pwRec, recovery: recRec, banned: false,
      role: 'admin', createdAt: new Date().toISOString(), lastLogin: null
    }]);
    if (!api.getProfile(ADMIN_USERNAME)) api.saveProfile(blankProfile(ADMIN_USERNAME));
    api.addLog('Created the chexxk admin account');
    pendingRecovery = { code, username: ADMIN_USERNAME };
    renderAuth('recovery');
  } catch (e) {
    err.textContent = e.message || 'Something went wrong. Try again.';
  } finally {
    const b = $('setup-go');
    if (b) b.disabled = false;
  }
}

/* =========================================================================
   11. ROUTER
   Routes: #/ (home), #/explore, #/admin, #/username (profile)
   ========================================================================= */
function currentRoute() {
  try {
    return decodeURIComponent((location.hash || '').replace(/^#\/?/, '')).toLowerCase().split('?')[0];
  } catch (e) {
    return '';
  }
}

function route() {
  stopAudio();
  setBgImage(null);
  applyUserCss('');
  closeShare();
  const seg = currentRoute();
  const site = api.getSite();
  $('site-name').textContent = site.name;
  renderNav();
  if (seg === 'logout') {
    endSession();
    toast('Logged out');
    location.hash = '#/';
    return;
  }

  noticeIfBannedSession();
  adminUnlocked = isAdminSession();
  renderAnnounce();
  if (site.maintenance && !adminUnlocked && seg !== 'admin') return renderMaintenance(site);
  if (seg === '') return renderHome(site);
  if (seg === 'explore') return renderExplore();
  if (seg === 'settings') return renderDashboard();
  if (seg === 'signup' && pendingRecovery) return renderAuth('recovery');
  if (seg === 'login' || seg === 'signup' || seg === 'forgot' || seg === 'setup') return renderAuth(seg);
  if (seg === 'admin') return renderAdmin();

  const p = api.getProfile(seg);
  if (p && p.banned && !adminUnlocked) return renderSuspended(p);
  if (p && (!p.hidden || adminUnlocked)) return renderProfile(p);
  return render404(seg);
}

/* =========================================================================
   12. EVENTS (one delegated listener per area, no inline handlers)
   ========================================================================= */
function onAppClick(e) {
  const t = e.target;

  // Link and connection clicks are counted, then the link opens as normal
  const tracked = t.closest('[data-click]');
  if (tracked) api.recordClick(tracked.dataset.u);

  const filter = t.closest('[data-filter]');
  if (filter) { exploreFilter = filter.dataset.filter; renderExplore(); return; }

  const tab = t.closest('[data-atab]');
  if (tab) { adminTab = tab.dataset.atab; renderAdmin(); return; }

  const pick = t.closest('[data-pick]');
  if (pick) {
    selectedU = pick.dataset.pick;
    draft = clone(api.getProfile(selectedU));
    renderProfilesList();
    renderEditor();
    return;
  }

  const badgeToggle = t.closest('[data-badge-toggle]');
  if (badgeToggle && draft) {
    const id = badgeToggle.dataset.badgeToggle;
    draft.badges = draft.badges.includes(id) ? draft.badges.filter((x) => x !== id) : [...draft.badges, id];
    renderEditor();
    return;
  }

  const rowAct = t.closest('[data-act]');
  if (rowAct && draft) {
    const list = rowAct.dataset.list;
    const act = rowAct.dataset.act;
    const i = Number(rowAct.dataset.i);
    const arr = draft[list];
    if (act === 'add') arr.push(ROW_BLANK[list]());
    else if (act === 'rm') arr.splice(i, 1);
    else if (act === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    else if (act === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    renderEditor();
    return;
  }

  const pl = t.closest('[data-pl]');
  if (pl) { playerAction(pl.dataset.pl); return; }

  const badgeAct = t.closest('[data-badge-act]');
  if (badgeAct) {
    const bid = badgeAct.dataset.bid;
    confirmClick(badgeAct, 'badge:' + bid, () => {
      const b = badgeById(bid);
      if (!allowed('badges')) return;
      api.removeBadge(bid);
      api.addLog('Deleted badge ' + (b ? b.label : bid));
      renderAdminPane();
    });
    return;
  }

  const acctAct = t.closest('[data-acct-act]');
  if (acctAct) {
    const u = acctAct.dataset.u;
    const act = acctAct.dataset.acctAct;
    if (act === 'ban') setAccountBanned(u, true, ($('ban-reason-' + u) || {}).value || '');
    else if (act === 'unban') setAccountBanned(u, false, '');
    else if (act === 'note') addAccountNote(u, ($('note-' + u) || {}).value || '');
    else if (act === 'reset') resetAccountPassword(u);
    else if (act === 'delete') confirmClick(acctAct, 'acct:' + u, () => deleteAccount(u));
    return;
  }

  const pwBtn = t.closest('[data-pw-toggle]');
  if (pwBtn) {
    const input = $(pwBtn.dataset.pwToggle);
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    pwBtn.textContent = reveal ? 'Hide' : 'Show';
    return;
  }

  const ruleAct = t.closest('[data-rule-act]');
  if (ruleAct) {
    if (!allowed('rules')) return;
    const rid = ruleAct.dataset.rid;
    const rule = api.listRules().find((r) => r.id === rid);
    if (!rule) return;
    if (ruleAct.dataset.ruleAct === 'toggle') {
      const list = api.listRules();
      list.find((r) => r.id === rid).enabled = !rule.enabled;
      api.saveRules(list);
      api.addLog((rule.enabled ? 'Paused' : 'Resumed') + ' an auto-award rule');
      renderAdminPane();
    } else {
      confirmClick(ruleAct, 'rule:' + rid, () => {
        api.saveRules(api.listRules().filter((r) => r.id !== rid));
        api.addLog('Deleted an auto-award rule');
        renderAdminPane();
      });
    }
    return;
  }

  const reportAct = t.closest('[data-report-act]');
  if (reportAct) {
    if (!allowed('moderate')) return;
    const u = reportAct.dataset.u;
    const p = api.getProfile(u);
    if (reportAct.dataset.reportAct === 'hide' && p) {
      p.hidden = true;
      api.saveProfile(p);
      api.addLog('Hid @' + u + ' after reports');
      toast('Profile hidden');
    } else {
      api.clearReports(u);
      api.addLog('Dismissed reports for @' + u);
      toast('Reports dismissed');
    }
    renderAdminPane();
    return;
  }

  const btn = t.closest('button');
  if (!btn) return;
  switch (btn.id) {
    case 'setup-go': setupFlow(); break;
    case 'role-set': setRole($('role-user').value, $('role-value').value); break;
    case 'bulk-apply': bulkApply(); break;
    case 'bulk-all': visibleProfiles().forEach((p) => selectedSet.add(p.username)); renderProfilesList(); break;
    case 'temp-dismiss': tempReset = null; renderAdminPane(); break;
    case 'log-clear': confirmClick(btn, 'log', () => { if (!allowed('audit')) return; put(KEYS.log, []); api.addLog('Cleared the log'); renderAdminPane(); }); break;
    case 'follow': toggleFollow(btn); break;
    case 'share': openShare(); break;
    case 'report-toggle': {
      const box = $('report-box');
      if (box) box.hidden = !box.hidden;
      break;
    }
    case 'report-send': {
      api.addReport(currentRoute(), $('report-reason').value);
      $('report-box').hidden = true;
      toast('Thanks. Your report was sent.');
      break;
    }
    case 'p-create': createProfile(); break;
    case 'ed-save': saveDraft(); break;
    case 'ed-save-top': saveDraft(); break;
    case 'ed-delete': deleteDraft(btn); break;
    case 'ed-ban': toggleBan(); break;
    case 'ed-export': exportDraft(); break;
    case 'ed-import': importDraft(); break;
    case 'badge-create': createBadge(); break;
    case 'bulk-go': bulkAssign(); break;
    case 'rule-add': addRule(); break;
    case 'rule-run': {
      if (!allowed('rules')) break;
      const n = applyRules();
      toast(`Auto-award gave ${n} badge(s)`);
      renderAdminPane();
      break;
    }
    case 'site-save': saveSite(); break;
    case 'backup-export': exportAll(); break;
    case 'backup-import': confirmClick(btn, 'backup', importAll); break;
    case 'login-go': loginFlow(); break;
    case 'signup-go': signupFlow(); break;
    case 'forgot-go': forgotFlow(); break;
    case 'recovery-done': finishSignup(); break;
    case 'copy-recovery': copyRecovery(); break;
    case 'discord-btn': toast('Discord sign-in needs an OAuth app. It comes with the Supabase setup.'); break;
  }
}

// Typing, selects, checkboxes, and uploads inside the admin panel
function onAppField(e) {
  const el = e.target;

  if (el.id === 'p-search' && e.type === 'input') { renderProfilesList(); return; }
  if (el.dataset.sel && el.type === 'checkbox') {
    if (el.checked) selectedSet.add(el.dataset.sel); else selectedSet.delete(el.dataset.sel);
    updateSelCount();
    return;
  }
  if (el.id === 'explore-sort' && e.type === 'change') { exploreSort = el.value; renderExplore(); return; }
  if ((el.id === 'acct-search' && e.type === 'input') || (el.id === 'acct-role' && e.type === 'change')) { renderAccountsList(); return; }
  if (el.id === 'log-search' && e.type === 'input') {
    logQuery = el.value;
    if ($('log-list')) $('log-list').innerHTML = logListHTML();
    return;
  }
  if (el.id === 'su-username' && e.type === 'input') { updateUsernameStatus(); return; }
  if (el.id === 'su-password' && e.type === 'input') { updateStrength(); return; }

  if (el.type === 'file') {
    if (e.type === 'change' && el.dataset.upload) handleUpload(el);
    return;
  }

  if (el.dataset.bfield) {
    if (e.type === 'change') saveBadgeField(el);
    return;
  }

  if (el.dataset.k && draft) {
    draft[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
    refreshPreview();
    return;
  }

  if (el.dataset.f && el.dataset.list && draft) {
    const row = draft[el.dataset.list][Number(el.dataset.i)];
    if (row) {
      row[el.dataset.f] = el.value;
      refreshPreview();
    }
  }
}

function hexBackground() {
  const hctx = $('hex').getContext('2d');
  const SIZE = 34;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mouse = { x: -9999, y: -9999 };
  let cells = [];
  let t = 0;

  function hexPath(x, y, r) {
    hctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 180) * (60 * i - 30);
      const px = x + r * Math.cos(a);
      const py = y + r * Math.sin(a);
      if (i === 0) hctx.moveTo(px, py); else hctx.lineTo(px, py);
    }
    hctx.closePath();
  }

  function build() {
    cells = [];
    const hw = SIZE * Math.sqrt(3);
    const vh = SIZE * 1.5;
    const cols = Math.ceil(innerWidth / hw) + 3;
    const rows = Math.ceil(innerHeight / vh) + 3;
    for (let r = -1; r < rows; r++) {
      for (let c = -1; c < cols; c++) cells.push({ x: c * hw + (r & 1 ? hw / 2 : 0), y: r * vh, flash: 0 });
    }
  }

  function resize() {
    const canvas = $('hex');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function draw() {
    hctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const c of cells) {
      const wave = (Math.sin(c.x * 0.006 + c.y * 0.004 - t * 1.4) + 1) / 2;
      const near = Math.max(0, 1 - Math.hypot(c.x - mouse.x, c.y - mouse.y) / 220);
      if (!reduceMotion) {
        c.flash *= 0.965;
        if (Math.random() < 0.0004) c.flash = 1;
      }
      hexPath(c.x, c.y, SIZE - 2);
      hctx.strokeStyle = `rgba(59, 130, 255, ${Math.min(0.07 + wave * 0.1 + c.flash * 0.55 + near * 0.6, 1)})`;
      hctx.lineWidth = 1;
      hctx.stroke();
      const fill = c.flash * 0.18 + near * 0.12;
      if (fill > 0.01) {
        hctx.fillStyle = `rgba(59, 130, 255, ${Math.min(fill, 0.3)})`;
        hctx.fill();
      }
    }
  }

  function frame() {
    t += 0.016;
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('pointerleave', () => { mouse.x = -9999; mouse.y = -9999; });
  resize();
  if (reduceMotion) draw(); else requestAnimationFrame(frame);
}

function init() {
  $('site-mark').src = MARK_SRC;
  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.href = MARK_SRC;
  document.head.appendChild(favicon);
  initData();
  applyRules();
  hexBackground();

  app.addEventListener('click', onAppClick);
  app.addEventListener('input', onAppField);
  document.addEventListener('load', (e) => { if (e.target.tagName === 'IMG') e.target.classList.remove('skel'); }, true);
  document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.classList.remove('skel'); }, true);
  app.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.enter) return;
    const b = $(e.target.dataset.enter);
    if (b) b.click();
  });
  app.addEventListener('change', onAppField);

  $('share-close').addEventListener('click', closeShare);
  $('share-copy').addEventListener('click', copyShareUrl);
  $('share-modal').addEventListener('click', (e) => { if (e.target === $('share-modal')) closeShare(); });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeShare();
      return;
    }
    const typing = e.target.closest && e.target.closest('input, textarea, select');
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      location.hash = currentRoute() === 'admin' ? '#/' : '#/admin';
    }
  });

  window.addEventListener('hashchange', route);
  route();
}

init();
