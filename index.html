<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chexxk</title>
<meta name="description" content="chexxk: one link for everything you are.">
<meta property="og:title" content="chexxk">
<meta property="og:description" content="chexxk: one link for everything you are.">
<meta property="og:type" content="website">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     1. THEME AND BASE
     ========================================================================= */
  :root {
    --bg: #030817;
    --glow: #3b82ff;
    --glow-bright: #9fd0ff;
    --text: #e8f0ff;
    --muted: #8d9cc0;
    --card: rgba(8, 12, 22, 0.84);
    --line: rgba(255, 255, 255, 0.08);
    --accent: #3b82ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", system-ui, sans-serif;
    overflow-x: hidden;
  }

  #hex { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 0%, var(--bg) 88%);
  }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Profile background image, blurred and darkened, shown only on profile pages */
  .bg-image {
    position: fixed; inset: -40px; z-index: 0; pointer-events: none;
    background-size: cover; background-position: center;
    filter: blur(28px) brightness(.35) saturate(.7);
    opacity: 0; transition: opacity .8s ease;
  }
  .bg-image.on { opacity: 1; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* =========================================================================
     2. TOP BAR AND LAYOUT
     ========================================================================= */
  .topbar {
    position: relative; z-index: 3;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px clamp(18px, 4vw, 40px);
  }

  .wordmark {
    font: 600 15px "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: .2em; color: #fff; text-decoration: none;
  }

  .topnav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-left: 18px; }
  .topnav a:hover { color: #fff; }

  .app {
    position: relative; z-index: 2;
    max-width: 1200px; margin: 0 auto;
    padding: 12px clamp(18px, 4vw, 40px) 80px;
  }

  .view { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }

  .page-title {
    font-family: "Cormorant Garamond", serif; font-weight: 700;
    font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.1; color: #fff;
  }
  .page-title.small { font-size: 1.6rem; }

  .label {
    margin-top: 22px;
    font: 700 11px "JetBrains Mono", monospace;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }

  .muted { color: var(--muted); margin-top: 10px; }
  .empty {
    font-size: 13px; color: var(--muted); padding: 18px; text-align: center;
    border: 1px dashed var(--line); border-radius: 12px;
  }

  /* =========================================================================
     3. HOME
     ========================================================================= */
  .home-view {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
    gap: clamp(28px, 5vw, 80px); align-items: center; min-height: 70vh;
  }

  .hero-title {
    font-family: "Unbounded", sans-serif; font-weight: 900;
    font-size: clamp(2rem, 4.6vw, 4rem); line-height: 1.05; letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, var(--glow-bright), #fff, var(--glow-bright));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 7s linear infinite;
  }

  .lead { margin-top: 24px; color: var(--muted); }

  .join-wrap {
    display: inline-block; margin-top: 16px;
    filter: drop-shadow(0 0 18px rgba(59, 130, 255, .55));
    animation: pulse 2.8s ease-in-out infinite;
  }

  .join {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 20px clamp(26px, 4vw, 48px);
    font-family: "Unbounded", sans-serif; font-weight: 700;
    font-size: clamp(.9rem, 2vw, 1.05rem); color: #fff; text-decoration: none;
    background: linear-gradient(135deg, #3b82ff, #13307f);
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    transition: transform .3s ease;
  }
  .join:hover { transform: scale(1.05); }
  .join:focus-visible, .join-wrap:has(.join:focus-visible) { outline: 2px solid var(--glow-bright); outline-offset: 10px; }

  .note { margin-top: 22px; color: var(--muted); font-size: .95rem; }
  .home-links { margin-top: 18px; }
  .home-links a { color: var(--glow-bright); }

  .mini {
    display: flex; align-items: center; gap: 14px; padding: 18px;
    background: var(--card); border: 1px solid rgba(120, 160, 255, .14);
    border-radius: 18px; color: inherit; text-decoration: none;
    backdrop-filter: blur(10px); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
    transition: transform .25s ease, border-color .25s ease;
  }
  .mini:hover { transform: translateY(-3px); border-color: rgba(59, 130, 255, .5); }
  .mini-name { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 24px; color: #fff; }

  /* =========================================================================
     4. SHARED PIECES: AVATARS, BADGES, BUTTONS, FIELDS
     ========================================================================= */
  .av {
    border-radius: 50%; object-fit: cover; flex-shrink: 0; display: block;
    border: 2px solid rgba(255, 255, 255, .12);
  }
  .avatar-fallback {
    display: grid; place-items: center;
    background: linear-gradient(135deg, #3b82ff, #13307f);
    font-family: "Unbounded", sans-serif; font-weight: 900; color: #fff;
  }

  .badges { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .pbadge {
    position: relative; display: inline-grid; place-items: center;
    width: 26px; height: 26px; border-radius: 8px; color: var(--c, #9fd0ff);
    background: rgba(59, 130, 255, .12);
    background: color-mix(in srgb, var(--c, #9fd0ff) 14%, transparent);
    border: 1px solid rgba(59, 130, 255, .45);
    border: 1px solid color-mix(in srgb, var(--c, #9fd0ff) 45%, transparent);
    cursor: default;
  }
  .pbadge svg { width: 15px; height: 15px; }
  .pbadge::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%) translateY(4px);
    white-space: nowrap; padding: 6px 9px; border-radius: 6px;
    background: #0b1222; border: 1px solid rgba(255, 255, 255, .12);
    color: var(--text); font: 600 12px "Manrope", sans-serif;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5;
  }
  .pbadge:hover::after, .pbadge:focus-visible::after { opacity: 1; transform: translateX(-50%); }
  .pbadge:focus-visible { outline: 2px solid var(--glow-bright); outline-offset: 2px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font: 700 14px "Manrope", sans-serif; padding: 10px 18px; border-radius: 10px;
    border: 1px solid rgba(59, 130, 255, .5); background: var(--glow); color: #fff;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: filter .2s, transform .15s, background .2s, color .2s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--glow-bright); outline-offset: 2px;
  }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.danger { background: transparent; color: #ff8a8a; border-color: rgba(255, 100, 100, .4); }
  .btn.danger.armed { background: #ff5d5d; color: #fff; border-color: #ff5d5d; }
  .btn.small { padding: 7px 12px; font-size: 12px; }
  .btn.follow { background: var(--accent); border-color: transparent; }
  .btn.follow.on { background: transparent; color: var(--glow-bright); border-color: rgba(59, 130, 255, .5); }

  .field {
    width: 100%; min-width: 0; padding: 10px 12px;
    background: #050a18; border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus { outline: none; border-color: rgba(59, 130, 255, .7); box-shadow: 0 0 0 3px rgba(59, 130, 255, .18); }
  .field::placeholder { color: #50628a; }
  textarea.field { resize: vertical; min-height: 70px; }
  input[type="color"] {
    width: 52px; height: 42px; padding: 4px; cursor: pointer;
    background: #050a18; border: 1px solid var(--line); border-radius: 10px;
  }
  input[type="checkbox"] { accent-color: #3b82ff; width: 18px; height: 18px; }

  .chip {
    font: 700 12px "Manrope", sans-serif; padding: 6px 11px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: transparent; color: var(--c); cursor: pointer;
    transition: background .2s;
  }
  .chip.on { background: color-mix(in srgb, var(--c) 24%, transparent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  /* =========================================================================
     5. PUBLIC PROFILE
     ========================================================================= */
  .profile-view { max-width: 500px; margin: 0 auto; --accent: #3b82ff; }

  .p-card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid rgba(120, 160, 255, .14);
    border-radius: 20px; backdrop-filter: blur(12px);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
  }

  .p-banner {
    position: relative; height: 150px;
    background: linear-gradient(135deg, #0c2a6b, #050a18 70%);
    background-size: cover; background-position: center;
  }
  .p-banner::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(7, 11, 22, .9));
  }

  .views-pill {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(0, 0, 0, .45); border: 1px solid rgba(255, 255, 255, .14);
    font: 600 12px "JetBrains Mono", monospace; color: #fff;
  }
  .views-pill svg { width: 14px; height: 14px; }

  .p-avatar-wrap { position: relative; z-index: 2; margin: -52px 0 0 24px; }
  .p-avatar {
    border: 4px solid #0a0f1d;
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .p-body { padding: 14px 24px 26px; }

  .p-name {
    font-family: "Cormorant Garamond", serif; font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.6rem); line-height: 1.05; color: #fff;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  .p-handle {
    margin-top: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font: 600 14px "JetBrains Mono", monospace; color: var(--muted);
  }

  .p-bio { margin-top: 14px; color: #c3cde6; line-height: 1.55; }

  .p-actions { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .followers { font-size: 13px; color: var(--muted); margin-left: auto; }

  .conn-list, .link-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

  .conn, .link-btn {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 12px; background: rgba(255, 255, 255, .04);
    border: 1px solid var(--line); color: var(--text); text-decoration: none;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .conn:hover, .link-btn:hover {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    transform: translateY(-1px);
  }
  .link-btn { justify-content: space-between; font-weight: 700; }
  .conn-label { flex: 1; font-weight: 600; }
  .conn svg, .link-btn svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .mono-ico {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px;
    background: rgba(59, 130, 255, .18); color: #cfe0ff;
    font: 700 11px "JetBrains Mono", monospace;
  }

  /* Music player */
  .player {
    max-width: 500px; margin: 18px auto 0; padding: 18px;
    background: var(--card); border: 1px solid rgba(120, 160, 255, .14);
    border-radius: 18px; backdrop-filter: blur(12px);
  }
  .pl-top { display: flex; gap: 14px; align-items: center; }
  .pl-cover { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .pl-meta { min-width: 0; }
  .pl-title, .pl-artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-title { font-weight: 700; color: #fff; }
  .pl-artist { font-size: 13px; color: var(--muted); }
  .pl-bar {
    position: relative; margin-top: 16px; height: 6px; border-radius: 99px;
    background: rgba(255, 255, 255, .12); cursor: pointer;
  }
  .pl-fill { height: 100%; width: 0; border-radius: 99px; background: var(--accent); }
  .pl-times {
    display: flex; justify-content: space-between; margin-top: 8px;
    font: 500 12px "JetBrains Mono", monospace; color: var(--muted);
  }
  .pl-controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 10px; }
  .pl-btn {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: #fff; cursor: pointer;
  }
  .pl-btn svg { width: 18px; height: 18px; }
  .pl-main { width: 54px; height: 54px; background: var(--accent); border-color: transparent; }
  .pl-note { margin-top: 12px; text-align: center; font-size: 12px; color: var(--muted); }

  /* =========================================================================
     6. EXPLORE, 404, MAINTENANCE, PASSCODE GATE
     ========================================================================= */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
  .chip-filter {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 13px "Manrope", sans-serif; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--text); cursor: pointer;
  }
  .chip-filter.on { border-color: rgba(59, 130, 255, .6); background: rgba(59, 130, 255, .16); }
  .chip-filter > span:last-child { color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .ex-card {
    display: flex; gap: 14px; align-items: center; padding: 16px;
    background: var(--card); border: 1px solid rgba(120, 160, 255, .14);
    border-radius: 16px; color: inherit; text-decoration: none;
    transition: transform .25s, border-color .25s;
  }
  .ex-card:hover { transform: translateY(-3px); border-color: rgba(59, 130, 255, .5); }
  .ex-name { font-family: "Cormorant Garamond", serif; font-size: 21px; font-weight: 700; color: #fff; }
  .ex-handle { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); margin: 2px 0 6px; }

  .notfound, .gate-view { text-align: center; padding: 60px 0; }
  .row-end { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .gate { max-width: 420px; margin: 0 auto; }
  .gate-row { display: flex; gap: 10px; margin-top: 18px; }
  .gate-row .field { flex: 1; }
  .gate-error { min-height: 18px; margin-top: 10px; color: #ff8a8a; font-size: 13px; }

  /* =========================================================================
     7. ADMIN PAGE
     ========================================================================= */
  .admin-view { max-width: 1040px; margin: 0 auto; }
  .admin-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }

  .tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: 18px;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
    border-radius: 12px; overflow-x: auto;
  }
  .tab {
    flex: 1; white-space: nowrap; padding: 9px 12px; border: 0; border-radius: 9px;
    background: transparent; color: var(--muted);
    font: 700 13px "Manrope", sans-serif; cursor: pointer;
  }
  .tab.on { background: rgba(59, 130, 255, .18); color: #fff; box-shadow: inset 0 0 0 1px rgba(59, 130, 255, .35); }

  .split { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .split-left, .split-right {
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px;
  }
  .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .add-row { display: flex; gap: 8px; }
  .add-row .field { flex: 1; }
  .plist { display: flex; flex-direction: column; gap: 6px; max-height: 62vh; overflow: auto; }
  .prow {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px;
    border-radius: 12px; border: 1px solid transparent; background: transparent;
    color: var(--text); text-align: left; cursor: pointer;
  }
  .prow:hover { background: rgba(255, 255, 255, .04); }
  .prow.on { background: rgba(59, 130, 255, .12); border-color: rgba(59, 130, 255, .4); }
  .prow b { font-weight: 700; display: block; }
  .prow small { display: block; color: var(--muted); font: 500 12px "JetBrains Mono", monospace; }

  .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ed-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .ed-section h4 {
    font: 700 11px "JetBrains Mono", monospace; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field-label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .opt { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }

  .row-item { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
  .row-item .field { flex: 1 1 140px; width: auto; }
  .row-item select.field { flex: 0 1 150px; }
  .row-btns { display: flex; gap: 6px; }
  .row-btns button {
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--text);
  }
  .row-btns button.rm { color: #ff8a8a; }

  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }

  .badge-admin-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px; margin-bottom: 8px;
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 14px;
  }
  .badge-admin-row .field { flex: 1 1 120px; width: auto; }
  .badge-admin-row .order-field { flex: 0 0 70px; }
  .badge-admin-row .muted { margin: 0; font-size: 12px; white-space: nowrap; }
  .create-badge { margin-top: 18px; padding: 16px; border: 1px dashed var(--line); border-radius: 14px; }
  .create-badge .row-item { border: 0; padding: 0; margin: 10px 0 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { padding: 16px; border-radius: 14px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
  .stat span { font: 700 11px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .stat b { display: block; margin-top: 6px; font-family: "Unbounded", sans-serif; font-size: 24px; color: #fff; }

  .chart {
    display: flex; align-items: flex-end; gap: 10px; height: 180px; margin-top: 12px;
    padding: 12px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 14px;
  }
  .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
  .bar { width: 100%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #9fd0ff, #3b82ff); }
  .bar-col span { font-size: 11px; color: var(--muted); }

  .log-row {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .log-row time { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); white-space: nowrap; }

  /* =========================================================================
     8. MODAL, TOASTS
     ========================================================================= */
  .modal {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(3, 8, 23, .72); backdrop-filter: blur(8px);
  }
  .modal[hidden] { display: none; }
  .modal-card {
    width: min(420px, 100%); padding: 22px; background: #0a1020;
    border: 1px solid rgba(120, 160, 255, .2); border-radius: 18px; animation: pop .28s both;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 700; color: #fff; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; font-size: 20px; line-height: 1;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--text); cursor: pointer;
  }
  .copy-row { display: flex; gap: 8px; }
  .copy-row .field { flex: 1; }
  .qr { margin: 18px auto 0; width: max-content; max-width: 100%; padding: 12px; border-radius: 12px; background: #fff; color: #000; min-height: 40px; }
  .qr svg { display: block; width: 200px; height: 200px; }

  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    max-width: 320px; padding: 12px 16px; border-radius: 12px; font-size: 14px;
    background: #0b1222; border: 1px solid rgba(120, 160, 255, .25); color: var(--text);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: rise .3s both;
  }
  .toast.error { border-color: rgba(255, 100, 100, .5); color: #ffb3b3; }

  /* =========================================================================
     9. ANIMATIONS
     ========================================================================= */
  @keyframes rise { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 300% 50%; } }
  @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 12px rgba(59, 130, 255, .35)); } 50% { filter: drop-shadow(0 0 30px rgba(159, 208, 255, .75)); } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

  /* =========================================================================
     10. RESPONSIVE AND REDUCED MOTION
     ========================================================================= */
  @media (max-width: 900px) {
    .home-view { grid-template-columns: 1fr; }
    .split { grid-template-columns: 1fr; }
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .add-row, .copy-row, .gate-row { flex-direction: column; }
    .followers { margin-left: 0; width: 100%; }
    .chart { height: 150px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* ---------- additions: appearance, live preview, uploads, rules, reports ---------- */
  .p-card {
    background: rgba(8, 12, 22, var(--card-alpha, .84));
    backdrop-filter: blur(var(--card-blur, 12px));
    -webkit-backdrop-filter: blur(var(--card-blur, 12px));
  }
  .profile-view { font-family: var(--body-font, "Manrope", system-ui, sans-serif); color: var(--text-color, #e8f0ff); }
  .profile-view.align-left { margin: 0 auto 0 0; }
  .p-name { font-family: var(--name-font, "Cormorant Garamond", Georgia, serif); }
  .p-meta { margin-top: 6px; font: 500 13px "JetBrains Mono", monospace; color: var(--muted); }
  .bg-video {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    z-index: 0; opacity: .35; filter: blur(6px) brightness(.6); pointer-events: none;
  }
  .bg-video[hidden] { display: none; }
  .report-box { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .report-box[hidden] { display: none; }
  .report-box .field { flex: 1 1 160px; width: auto; }
  .preview-box {
    padding: 12px; border-radius: 16px; background: #050a18;
    border: 1px solid var(--line); max-height: 520px; overflow: auto;
  }
  .preview-box .p-card { box-shadow: none; }
  .preview-box .p-banner { height: 110px; }
  .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .upload-row .field { flex: 1 1 200px; }
  .upload-row input[type="file"] { color: var(--muted); font-size: 12px; max-width: 100%; }
  .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); }
  .thumb-wide { width: 120px; height: 56px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); }
  .sub-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .css-error { min-height: 16px; margin-top: 6px; font-size: 12px; color: #ff8a8a; }
  .rule-row, .report-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .03);
  }
  .rule-row .field, .report-row .field { flex: 1 1 140px; width: auto; }
  .range { width: 100%; accent-color: #3b82ff; }
  /* ---------- accounts: log in, sign up, recovery ---------- */
  .auth-view { display: flex; justify-content: center; padding-top: 24px; }
  .auth-card {
    width: min(440px, 100%); padding: 28px;
    background: var(--card); border: 1px solid rgba(120, 160, 255, .14);
    border-radius: 20px; backdrop-filter: blur(12px);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
  }
  .auth-card .page-title { margin: 6px 0 4px; }
  .auth-form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .pw-row { display: flex; gap: 8px; align-items: center; }
  .pw-row .field { flex: 1; }
  .auth-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .auth-row a, .auth-foot a { color: var(--glow-bright); }
  .auth-foot { font-size: 14px; color: var(--muted); text-align: center; }
  .auth-error { min-height: 18px; font-size: 13px; color: #ff8a8a; }
  .auth-ok { color: #7ff0bd; }
  .full-btn { width: 100%; justify-content: center; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .meter { display: block; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .meter-fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f87171, #fbbf24, #34d399); transition: width .3s ease; }

    display: block; margin-top: 14px; padding: 14px; border-radius: 12px; text-align: center;

    font: 700 18px "JetBrains Mono", monospace; letter-spacing: .12em;
  }
  /* ---------- dashboard, skeletons, skip link ---------- */
  .skip {
    position: fixed; left: 12px; top: -60px; z-index: 100;

  }
  @keyframes shimmerx { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  /* ---------- admin additions: announcements, bulk bar, account tags, toolbars ---------- */
  .announce {
    position: relative; z-index: 3; margin: 0 auto; max-width: 1200px; padding: 10px 18px;
    text-align: center; font-size: 14px; color: #fff;

  .toolbar-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

  .tag {

  .acct-main { flex: 1 1 260px; min-width: 0; }
  .acct-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .note-row { display: flex; gap: 6px; margin-top: 8px; }
  .note-row .field { flex: 1; }

  /* ---------- site logo ---------- */
  .wordmark { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; }
  .site-mark {
    width: 54px; height: auto; border-radius: 8px; display: block;

const $ = (id) => document.getElementById(id);

// Escape text before putting it into HTML
function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Only http and https links are allowed. Anything else becomes '#'.
function safeUrl(u) {
  try {
    const x = new URL(String(u || '').trim());
    return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '#';
  } catch (e) {
    return '#';
  }
}

// Image sources: our built-in data URI, or an http(s) link
function validImg(u) { return !!u && (String(u).startsWith('data:image/') || safeUrl(u) !== '#'); }
function imgSrc(u) { return String(u).startsWith('data:image/') ? u : safeUrl(u); }

function fmt(n) { return (Number(n) || 0).toLocaleString(); }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function slug(name) { return String(name || '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20); }
function isValidUsername(u) { return /^[a-z0-9_]{3,20}$/.test(u); }
function fmtTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'error' ? ' error' : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// Page title and social preview tags, updated on each route change
function setMeta(title, desc, image) {
  document.title = title;
  setTag('meta[name="description"]', 'name', 'description', desc);
  setTag('meta[property="og:title"]', 'property', 'og:title', title);
  setTag('meta[property="og:description"]', 'property', 'og:description', desc);
  setTag('meta[property="og:image"]', 'property', 'og:image', image || '');
  setTag('meta[name="twitter:card"]', 'name', 'twitter:card', image ? 'summary_large_image' : 'summary');
}
function setTag(sel, attr, key, val) {
  let el = document.querySelector(sel);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(attr, key);
    document.head.appendChild(el);
  }
  el.setAttribute('content', val);
}

/* =========================================================================
   5. DATA LAYER (the "api" object)
   All reads and writes go through api. In phase 2 these methods will call
   Supabase instead of localStorage. Demo mode: NOT SECURE, data is per browser.
   ========================================================================= */
const KEYS = {
  site: 'chexxk-site',
  profiles: 'chexxk-profiles',
  badges: 'chexxk-badges',
  views: 'chexxk-view-log',
  log: 'chexxk-log',
  follows: 'chexxk-follows',
  rules: 'chexxk-rules',
  reports: 'chexxk-reports'
};

function store(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : JSON.parse(v);
  } catch (e) { return fallback; }
}
function put(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { toast('Browser storage is full or blocked', 'error'); }
}

function blankProfile(username) {
  return {
    username, displayName: username, pronouns: '', location: '', bio: '',
    avatar: '', banner: '', accent: '#3b82ff', textColor: '#e8f0ff',
    cardAlpha: 0.84, cardBlur: 12, font: 'serif', align: 'center',
    bgStyle: 'default', bg: '', bgColor: '#050a18', bgColor2: '#13307f',
    badges: [], connections: [], links: [], tracks: [], css: '',
    showViews: true, showBadges: true, showPlayer: true,
    hidden: false, banned: false, followers: 0, views: 0, clicks: 0,
    createdAt: new Date().toISOString()
  };
}

const api = {
  mode: 'demo',

  getSite() {
    return Object.assign(
      { name: CONFIG.siteName, maintenance: false, signupsOpen: true, announcement: '', featured: 'solojett', reserved: DEFAULT_RESERVED.slice() },
      store(KEYS.site, {})
    );
  },
  saveSite(s) { put(KEYS.site, s); },

  listProfiles() {
    return store(KEYS.profiles, []).map((p) => Object.assign(blankProfile(p.username), p));
  },
  getProfile(u) { return this.listProfiles().find((p) => p.username === u) || null; },
  saveProfile(p) {
    const list = this.listProfiles();
    const i = list.findIndex((x) => x.username === p.username);
    if (i >= 0) list[i] = p; else list.push(p);
    put(KEYS.profiles, list);
  },
  saveAllProfiles(list) { put(KEYS.profiles, list); },
  deleteProfile(u) { put(KEYS.profiles, this.listProfiles().filter((p) => p.username !== u)); },
  isUsernameFree(u) { return !this.getProfile(u) && !this.getSite().reserved.includes(u); },

  listBadges() { return store(KEYS.badges, []).slice().sort((a, b) => a.order - b.order); },
  saveBadges(list) { put(KEYS.badges, list); },
  removeBadge(id) {
    this.saveBadges(this.listBadges().filter((b) => b.id !== id));
    const profiles = this.listProfiles();
    profiles.forEach((p) => { p.badges = p.badges.filter((x) => x !== id); });
    put(KEYS.profiles, profiles);
  },

  recordView(u) {
    const list = this.listProfiles();
    const p = list.find((x) => x.username === u);
    if (!p) return;
    p.views = (p.views || 0) + 1;
    put(KEYS.profiles, list);
    const log = store(KEYS.views, []);
    log.push({ u, t: Date.now() });
    if (log.length > CONFIG.maxViewLog) log.splice(0, log.length - CONFIG.maxViewLog);
    put(KEYS.views, log);
  },
  recordClick(u) {
    const list = this.listProfiles();
    const p = list.find((x) => x.username === u);
    if (!p) return;
    p.clicks = (p.clicks || 0) + 1;
    put(KEYS.profiles, list);
  },
  viewsPerDay(days, u) {
    const log = store(KEYS.views, []);
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - i);
      const start = d.getTime();
      const end = start + 86400000;
      out.push({ label: d.toLocaleDateString(undefined, { weekday: 'short' }), count: log.filter((e) => (!u || e.u === u) && e.t >= start && e.t < end).length });
    }
    return out;
  },

  listRules() { return store(KEYS.rules, []); },
  saveRules(list) { put(KEYS.rules, list); },
  listReports() { return store(KEYS.reports, []); },
  addReport(u, reason) {
    const r = this.listReports();
    r.push({ u, reason, t: Date.now() });
    put(KEYS.reports, r.slice(-500));
  },
  clearReports(u) { put(KEYS.reports, this.listReports().filter((r) => r.u !== u)); },
  replaceAll(d) {
    if (d.site) put(KEYS.site, d.site);
    if (d.badges) put(KEYS.badges, d.badges);
    if (d.profiles) put(KEYS.profiles, d.profiles);
    if (d.rules) put(KEYS.rules, d.rules);
    if (d.reports) put(KEYS.reports, d.reports);
    if (d.accounts) put(ACCOUNTS_KEY, d.accounts);
  },

  getLog() { return store(KEYS.log, []); },
  addLog(action) {
    const log = store(KEYS.log, []);
    const actor = currentSession();
    log.unshift({ t: Date.now(), action: `${actor ? '@' + actor.username : 'system'}: ${action}` });
    put(KEYS.log, log.slice(0, 300));
  },

  getFollows() { return store(KEYS.follows, []); },
  setFollow(u, on) {
    const f = this.getFollows().filter((x) => x !== u);
    if (on) f.push(u);
    put(KEYS.follows, f);
  }
};

/* Session view guard: each profile counts once per browser tab session */
const memSeen = new Set();
function seenThisSession(u) {
  const k = 'chexxk-seen:' + u;
  try {
    if (sessionStorage.getItem(k)) return true;
    sessionStorage.setItem(k, '1');
    return false;
  } catch (e) {
    if (memSeen.has(u)) return true;
    memSeen.add(u);
    return false;
  }
}

/* First run: seed data, or migrate data saved by the earlier version of this page */
function initData() {
  migrateBadges();
  if (store(KEYS.profiles, null) === null) put(KEYS.profiles, migrateOrSeed());
}

function migrateOrSeed() {
  const owner = store('chexxk-owner', null);
  const members = store('chexxk-members', null);
  const legacyBase = store('chexxk-owner-base', null);
  const legacyVerified = store('chexxk-owner-verified', null);
  const now = new Date().toISOString();

  if (!owner && !members) {
    const p = blankProfile('solojett');
    Object.assign(p, {
      displayName: 'solo+jett', bio: 'dev @ chexxk', avatar: LOGO_SRC, badges: ['dev', 'beryl'],
      connections: [{ platform: 'discord', url: CONFIG.discordInvite }],
      links: [{ title: 'Join chexxk hub', url: CONFIG.discordInvite }],
      createdAt: '2026-01-01T00:00:00.000Z'
    });
    return [p];
  }

  const out = [];
  const ownerBadges = Array.isArray(owner && owner.badges) ? owner.badges.slice() : ['dev', 'beryl'];
  if ((owner && owner.verified) || legacyVerified) ownerBadges.push('verified');
  const op = blankProfile('solojett');
  Object.assign(op, {
    displayName: (owner && owner.name) || 'solo+jett',
    bio: (owner && owner.bio) || 'dev @ chexxk',
    avatar: LOGO_SRC,
    badges: [...new Set(ownerBadges)],
    followers: Number(legacyBase !== null ? legacyBase : (owner && owner.followers)) || 0,
    createdAt: '2026-01-01T00:00:00.000Z'
  });
  out.push(op);

  (members || []).forEach((m) => {
    let u = slug(m.name) || 'member';
    if (u.length < 3) u = (u + '_member').slice(0, 20);
    const stem = u;
    let n = 2;
    while (out.some((p) => p.username === u)) u = stem.slice(0, 17) + '_' + n++;
    const badges = Array.isArray(m.badges) ? m.badges.slice() : [];
    if (m.verified) badges.push('verified');
    if (m.admin) badges.push('staff');
    const p = blankProfile(u);
    Object.assign(p, { displayName: m.name, badges: [...new Set(badges)], followers: Number(m.followers) || 0, createdAt: now });
    out.push(p);
  });
  return out;
}

function hexOr(c, fallback) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : fallback; }

/* Custom CSS: flat rules only. Every selector is scoped under #profile-scope,
   so a profile can't restyle the rest of the site. No @rules, url(), imports,
   scripts, or escapes. */
function sanitizeCss(raw) {
  const css = String(raw || '').replace(/\/\*[\s\S]*?\*\//g, '');
  if (!css.trim()) return { css: '' };
  if (css.length > 6000) return { error: 'too long (6000 characters max)' };
  const low = css.toLowerCase();
  const banned = ['url(', '@', 'expression', 'javascript:', 'behavior', '-moz-binding', 'image-set', '<', '>', '\\'];
  const hit = banned.find((b) => low.includes(b));
  if (hit) return { error: `"${hit}" is not allowed` };
  let out = '';
  for (const chunk of css.split('}')) {
    if (!chunk.trim()) continue;
    const i = chunk.indexOf('{');
    if (i < 0) return { error: 'each rule needs { and }' };
    const selectors = chunk.slice(0, i).split(',').map((s) => s.trim()).filter(Boolean);
    const body = chunk.slice(i + 1).trim();
    if (!selectors.length) return { error: 'a rule has no selector' };
    if (body.includes('{')) return { error: 'nested rules are not allowed' };
    out += selectors.map((s) => `#profile-scope ${s}`).join(', ') + `{${body}}\n`;
  }
  return { css: out };
}

function applyUserCss(raw) {
  let el = $('user-css');
  if (!el) {
    el = document.createElement('style');
    el.id = 'user-css';
    document.head.appendChild(el);
  }
  const res = sanitizeCss(raw);
  el.textContent = res.error ? '' : (res.css || '');
  return res;
}

// Background: default hex grid, solid, gradient, image, or video (muted, looping)
function setBgImage(p) {
  const img = $('bg-image');
  const vid = $('bg-video');
  img.classList.remove('on');
  img.style.backgroundImage = '';
  vid.pause();
  vid.removeAttribute('src');
  vid.hidden = true;
  document.body.style.background = '';
  if (!p) return;
  if (p.bgStyle === 'image' && validImg(p.bg)) {
    img.style.backgroundImage = `url("${imgSrc(p.bg).replace(/"/g, '%22')}")`;
    img.classList.add('on');
  } else if (p.bgStyle === 'video' && safeUrl(p.bg) !== '#') {
    vid.src = safeUrl(p.bg);
    vid.hidden = false;
    vid.play().catch(() => {});
  } else if (p.bgStyle === 'solid') {
    document.body.style.background = hexOr(p.bgColor, '#050a18');
  } else if (p.bgStyle === 'gradient') {
    document.body.style.background = `linear-gradient(160deg, ${hexOr(p.bgColor, '#050a18')}, ${hexOr(p.bgColor2, '#13307f')})`;
  }
}

/* =========================================================================
   8. MUSIC PLAYER
   Uses the HTML5 audio element. Nothing loads or plays until a click.
   ========================================================================= */
let audio = null;
let playerProfile = null;
let trackIdx = 0;

function playerHTML() {
  return `
    <section class="player" aria-label="Music player">
      <div class="pl-top">
        <img class="pl-cover" id="pl-cover" src="${esc(LOGO_SRC)}" alt="" width="56" height="56" loading="lazy">
        <div class="pl-meta"><div class="pl-title" id="pl-title"></div><div class="pl-artist" id="pl-artist"></div></div>
      </div>
      <div class="pl-bar" id="pl-bar" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="pl-fill" id="pl-fill"></div>
      </div>
      <div class="pl-times"><span id="pl-cur">0:00</span><span id="pl-dur">0:00</span></div>
      <div class="pl-controls">
        <button class="pl-btn" type="button" data-pl="prev" aria-label="Previous track">${icon('prev')}</button>
        <button class="pl-btn pl-main" type="button" data-pl="toggle" id="pl-toggle" aria-label="Play">${icon('play')}</button>
        <button class="pl-btn" type="button" data-pl="next" aria-label="Next track">${icon('next')}</button>
      </div>
      <p class="pl-note">Music starts when you press play.</p>
    </section>`;
}

function wirePlayer(p) {
  stopAudio();
  playerProfile = p;
  trackIdx = 0;
  audio = new Audio();
  audio.preload = 'none';

  audio.addEventListener('timeupdate', () => {
    const d = audio.duration;
    const pct = isFinite(d) && d > 0 ? (audio.currentTime / d) * 100 : 0;
    $('pl-fill').style.width = pct + '%';
    $('pl-bar').setAttribute('aria-valuenow', String(Math.round(pct)));
    $('pl-cur').textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => { $('pl-dur').textContent = fmtTime(audio.duration); });
  audio.addEventListener('play', () => setToggleIcon(true));
  audio.addEventListener('pause', () => setToggleIcon(false));
  audio.addEventListener('ended', () => {
    const n = playerProfile.tracks.length;
    if (n > 1) loadTrack((trackIdx + 1) % n, true);
    else setToggleIcon(false);
  });

  $('pl-bar').addEventListener('click', (e) => {
    if (!audio || !isFinite(audio.duration)) { toast('Press play first', 'error'); return; }
    const r = $('pl-bar').getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    audio.currentTime = ratio * audio.duration;
  });
  $('pl-bar').addEventListener('keydown', (e) => {
    if (!audio || !isFinite(audio.duration)) return;
    if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
  });

  loadTrack(0, false);
}

function loadTrack(i, autoplay) {
  const tr = playerProfile.tracks[i];
  if (!tr) return;
  const src = safeUrl(tr.src);
  if (src === '#') { toast('This track link is invalid', 'error'); return; }
  trackIdx = i;
  audio.src = src;
  $('pl-title').textContent = tr.title || 'Untitled';
  $('pl-artist').textContent = tr.artist || '';
  $('pl-cover').src = validImg(tr.cover) ? imgSrc(tr.cover) : LOGO_SRC;
  $('pl-fill').style.width = '0%';
  $('pl-cur').textContent = '0:00';
  $('pl-dur').textContent = '0:00';
  if (autoplay) audio.play().catch(() => toast('This track could not play', 'error'));
}

function playerAction(a) {
  if (!audio || !playerProfile) return;
  const n = playerProfile.tracks.length;
  if (a === 'toggle') {
    if (audio.paused) {
      if (!audio.src) loadTrack(trackIdx, false);
      audio.play().catch(() => toast('This track could not play', 'error'));
    } else {
      audio.pause();
    }
  } else if (a === 'next') {
    loadTrack((trackIdx + 1) % n, !audio.paused);
  } else if (a === 'prev') {
    loadTrack((trackIdx - 1 + n) % n, !audio.paused);
  }
}

function setToggleIcon(playing) {
  const b = $('pl-toggle');
  if (!b) return;
  b.innerHTML = icon(playing ? 'pause' : 'play');
  b.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}

function stopAudio() {
  if (audio) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
  }
  audio = null;
  playerProfile = null;
}

function toggleFollow(btn) {
  const u = btn.dataset.u;
  const on = !api.getFollows().includes(u);
  api.setFollow(u, on);
  btn.classList.toggle('on', on);
  btn.textContent = on ? 'Following' : 'Follow';
  btn.setAttribute('aria-pressed', String(on));
  const countEl = document.querySelector('.followers');
  if (countEl) countEl.textContent = fmt(followersOf(api.getProfile(u))) + ' followers';
  toast(on ? 'Following @' + u : 'Unfollowed @' + u);
}

function loadQrLib() {
  if (window.qrcode) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = CONFIG.qrLibUrl;
    s.onload = resolve;
    s.onerror = () => reject(new Error('QR library failed to load'));
    document.head.appendChild(s);
  });
}

function openShare() {
  const p = api.getProfile(currentRoute());
  if (!p) return;
  const url = location.href.split('#')[0] + '#/' + p.username;
  $('share-url').value = url;
  $('qr').textContent = 'Loading QR code...';
  $('share-modal').hidden = false;
  $('share-copy').focus();
  loadQrLib().then(() => {
    try {
      const q = window.qrcode(0, 'M');
      q.addData(url);
      q.make();
      $('qr').innerHTML = q.createSvgTag({ cellSize: 5, margin: 2 });
    } catch (e) {
      $('qr').textContent = 'QR code unavailable';
    }
  }).catch(() => { $('qr').textContent = 'QR code needs internet access'; });
}

function closeShare() { $('share-modal').hidden = true; }

function copyShareUrl() {
  const url = $('share-url').value;
  const fallback = () => {
    $('share-url').select();
    try { document.execCommand('copy'); toast('Link copied'); } catch (e) { toast('Copy the link manually', 'error'); }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => toast('Link copied')).catch(fallback);
  } else {
    fallback();
  }
}

        <div class="actions-row"><button class="btn ghost" id="ed-ban" type="button">${d.banned ? 'Unban' : 'Ban'}</button></div>

      ${canDelete ? `<button class="btn danger" id="ed-delete" type="button" data-label="Delete profile">Delete profile</button>` : ''}
    </div>`;

}

function validUrlField(u) { return !u || validImg(u); }
function validAudio(u) { return !!u && (String(u).startsWith('data:audio/') || safeUrl(u) !== '#'); }

function cleanDraft() {
  const d = draft;
  d.displayName = String(d.displayName || '').trim().slice(0, 32) || d.username;
  d.bio = String(d.bio || '').slice(0, 160);
  d.pronouns = String(d.pronouns || '').trim().slice(0, 30);
  d.location = String(d.location || '').trim().slice(0, 40);
  d.followers = Math.max(0, parseInt(d.followers, 10) || 0);
  d.accent = hexOr(d.accent, '#3b82ff');
  d.textColor = hexOr(d.textColor, '#e8f0ff');
  d.bgColor = hexOr(d.bgColor, '#050a18');
  d.bgColor2 = hexOr(d.bgColor2, '#13307f');
  d.cardAlpha = clamp(Number(d.cardAlpha) || 0.84, 0.3, 1);
  d.cardBlur = clamp(Number(d.cardBlur) || 0, 0, 30);
  d.font = FONT_CHOICES[d.font] ? d.font : 'serif';
  d.align = d.align === 'left' ? 'left' : 'center';
  d.bgStyle = ['default', 'solid', 'gradient', 'image', 'video'].includes(d.bgStyle) ? d.bgStyle : 'default';
  if (!validUrlField(d.avatar) || !validUrlField(d.banner) || !validUrlField(d.bg)) return 'Avatar, banner, and background need http or https links';
  if (d.bgStyle === 'video' && d.bg && safeUrl(d.bg) === '#') return 'Background video needs an https link';
  if (d.connections.some((c) => !PLATFORMS[c.platform] || safeUrl(c.url) === '#')) return 'Every connection needs a valid https link';
  if (d.links.some((l) => !String(l.title || '').trim() || safeUrl(l.url) === '#')) return 'Every link needs a title and a valid https link';
  if (d.tracks.some((t) => !validAudio(t.src) || !validUrlField(t.cover))) return 'Every track needs an audio file or https link';
  d.links.forEach((l) => { l.title = String(l.title || '').trim().slice(0, 40); });
  d.tracks.forEach((t) => {
    t.title = String(t.title || '').trim().slice(0, 60);
    t.artist = String(t.artist || '').trim().slice(0, 60);
  });
  const res = sanitizeCss(d.css);
  if (res.error) return 'Custom CSS: ' + res.error;
  d.css = String(d.css || '').replace(/\/\*[\s\S]*?\*\//g, '').slice(0, 6000);
  return '';
}

function saveDraft() {
  if (!draft) return;
  const u = draft.username;
  const stored = api.getProfile(u);
  if (!stored) { toast('Profile not found', 'error'); return; }
  // Counters and moderation state are never taken from the editor. Keep what's stored.
  ['views', 'clicks', 'createdAt', 'banned', 'banReason'].forEach((k) => { draft[k] = stored[k]; });
  if (editorMode === 'user' || !can('badges')) {
    draft.badges = stored.badges;
    draft.followers = stored.followers;
  }
  if (editorMode === 'user' || !can('moderate')) draft.hidden = stored.hidden;
  if (stored.banned) draft.hidden = true;
  const err = cleanDraft();
  if (err) { toast(err, 'error'); return; }
  api.saveProfile(clone(draft));
  if (editorMode === 'admin') api.addLog('Saved @' + u);
  applyRules();
  draft = clone(api.getProfile(u));
  toast('Profile saved');
  renderProfilesList();
  renderEditor();
}

function toggleBan() {
  if (!draft || !allowed('moderate')) return;
  const u = draft.username;
  const stored = api.getProfile(u);
  const nowBanned = !(stored && stored.banned);
  const reason = ($('ban-reason') || {}).value || '';
  setAccountBanned(u, nowBanned, reason);
  const after = api.getProfile(u);
  if (draft && draft.username === u && after && after.banned === nowBanned) {
    draft.banned = after.banned;
    draft.banReason = after.banReason;
    draft.hidden = after.hidden;
    renderEditor();
  }
}

function sanitizeImported(data) {
  const out = {};
  Object.keys(blankProfile('x')).forEach((k) => { if (k in data) out[k] = data[k]; });
  ['badges', 'connections', 'links', 'tracks'].forEach((k) => {
    if (k in out && !Array.isArray(out[k])) delete out[k];
  });
  return out;
}

function exportDraft() {
  if (!draft) return;
  const copy = clone(draft);
  delete copy.views;
  delete copy.clicks;
  $('ed-json').value = JSON.stringify(copy, null, 2);

}

function importDraft() {
  let data;
  try { data = JSON.parse($('ed-json').value); } catch (e) { toast('That is not valid JSON', 'error'); return; }
  const u = String((data && data.username) || '').trim().toLowerCase();
  if (!isValidUsername(u)) { toast('The JSON needs a valid username', 'error'); return; }
  const existing = api.getProfile(u);
  if (editorMode === 'user') {
    if (!draft || u !== draft.username) { toast('You can only load a profile into your own dashboard', 'error'); return; }
  } else if (!existing && !api.isUsernameFree(u)) {
    toast('That username is taken or reserved', 'error');
    return;
  }
  const base = existing ? clone(existing) : blankProfile(u);
  draft = Object.assign(base, sanitizeImported(data), { username: u, views: base.views, clicks: base.clicks });
  if (editorMode === 'user' && existing) {
    ['badges', 'followers', 'hidden', 'banned', 'createdAt'].forEach((k) => { draft[k] = existing[k]; });

// File uploads become data URLs stored with the profile (size-limited)
function handleUpload(input) {
  const kind = input.dataset.upload;
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || !draft) return;
  const isAudio = kind === 'newtrack';
  if (isAudio ? !file.type.startsWith('audio/') : !file.type.startsWith('image/')) {
    toast(isAudio ? 'Pick an audio file' : 'Pick an image file', 'error');
    return;
  }
  const max = isAudio ? 1500000 : (kind === 'avatar' ? 400000 : 800000);
  if (file.size > max) { toast(`That file is too big. The limit is ${Math.round(max / 1000)} KB.`, 'error'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    if (!draft) return;
    if (isAudio) {
      draft.tracks.push({ title: file.name.replace(/\.[^.]+$/, '').slice(0, 60), artist: '', src: reader.result, cover: '' });
    } else {
      draft[kind] = reader.result;
      if (kind === 'bg') draft.bgStyle = 'image';
    }
    toast('File added. Press Save profile to keep it.');
    renderEditor();
  };
  reader.onerror = () => toast('Could not read that file', 'error');
  reader.readAsDataURL(file);
}

      n++;
    }

  api.saveAllProfiles(profiles);

/* --- Auto-award rules --- */
function ruleMatches(rule, p) {
  const v = rule.value;
  if (rule.kind === 'created_before') return (p.createdAt || '').slice(0, 10) <= v;
  if (rule.kind === 'created_after') return (p.createdAt || '').slice(0, 10) >= v;
  if (rule.kind === 'followers_min') return followersOf(p) >= Number(v);
  if (rule.kind === 'views_min') return (p.views || 0) >= Number(v);
  return false;
}

// Adds rule badges to matching profiles. Never removes badges. Manual-only badges are skipped.
function applyRules() {
  const rules = api.listRules().filter((r) => r.enabled);
  if (!rules.length) return 0;
  const badges = api.listBadges();
  const profiles = api.listProfiles();
  let awarded = 0;
  rules.forEach((rule) => {
    const badge = badges.find((b) => b.id === rule.badgeId);
    if (!badge || badge.manualOnly) return;
    profiles.forEach((p) => {
      if (!p.badges.includes(rule.badgeId) && ruleMatches(rule, p)) {
        p.badges = [...p.badges, rule.badgeId];
        awarded++;
      }
    });
  });
  if (awarded) {
    api.saveAllProfiles(profiles);
    api.addLog(`Auto-award gave ${awarded} badge(s)`);
  }
  return awarded;
}

function addRule() {
  if (!allowed('rules')) return;
  const badgeId = $('rule-badge').value;
  const kind = $('rule-kind').value;
  const value = $('rule-value').value.trim();
  const badge = badgeById(badgeId);
  if (!badge || badge.manualOnly) { toast('Pick a badge that can be auto-awarded', 'error'); return; }
  if (RULE_KINDS[kind].input === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(value)) { toast('Use a date like 2026-01-31', 'error'); return; }
  if (RULE_KINDS[kind].input === 'number' && !(Number(value) >= 0)) { toast('Use a number of 0 or more', 'error'); return; }
  const list = api.listRules();
  list.push({ id: newId(), badgeId, kind, value, enabled: true });
  api.saveRules(list);
  api.addLog(`Added rule: ${badge.label} when ${RULE_KINDS[kind].label.toLowerCase()} ${value}`);
  const n = applyRules();
  toast(n ? `Rule added. Gave it to ${n} profile(s).` : 'Rule added');
  renderAdminPane();
}

/* --- Two-click confirm for destructive buttons (no browser popups) --- */
function confirmClick(button, key, action) {
  if (armedKey === key) {
    armedKey = null;
    action();
    return;
  }
  armedKey = key;
  button.textContent = 'Confirm';
  button.classList.add('armed');
  setTimeout(() => {
    if (armedKey === key) {
      armedKey = null;
      button.textContent = button.dataset.label || 'Delete';
      button.classList.remove('armed');
    }
  }, 3000);
}


/* =========================================================================
   10b. ACCOUNTS: sign up, log in, forgot password, sessions
   DEMO ONLY. Passwords are hashed in this browser with PBKDF2 (SHA-256,
   100,000 rounds, random salt), so plain passwords are never saved. Real
   hashing must run on a server: Supabase Auth in phase 2. The rate limit is
   per browser, so clearing storage resets it.
   ========================================================================= */
const ACCOUNTS_KEY = 'chexxk-accounts';
const FAILS_KEY = 'chexxk-login-fails';
const SESSION_KEY = 'chexxk-session';
const ALWAYS_RESERVED = ['admin', 'login', 'signup', 'settings', 'api', 'chexxk', 'forgot', 'logout', 'account', 'explore', 'home', 'static', 'profile', '404', 'setup', 'dashboard'];
const RECOVERY_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PBKDF2_ROUNDS = 100000;
let pendingRecovery = null;

Object.assign(api, {
  listAccounts() { return store(ACCOUNTS_KEY, []); },
  saveAccounts(list) { put(ACCOUNTS_KEY, list); },
  findAccount(ident) {
    const id = String(ident || '').trim().toLowerCase();
    if (!id) return null;
    return this.listAccounts().find((a) => a.username === id || a.email === id) || null;
  },
  emailTaken(email) { return this.listAccounts().some((a) => a.email === email); },
  usernameTaken(u) {
    return !!this.findAccount(u) || !!this.getProfile(u) || ALWAYS_RESERVED.includes(u) || this.getSite().reserved.includes(u);
  }
});

const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function hashSecret(secret, saltB64) {
  if (!window.crypto || !crypto.subtle) throw new Error('This browser cannot secure passwords. Try a newer browser over https.');
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PBKDF2_ROUNDS, hash: 'SHA-256' }, key, 256);
  return { salt: b64(salt), hash: b64(new Uint8Array(bits)) };
}

async function checkSecret(secret, rec) {
  if (!rec || !rec.salt) return false;
  const h = await hashSecret(secret, rec.salt);
  return h.hash === rec.hash;
}

function newRecoveryCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  const s = Array.from(bytes, (b) => RECOVERY_CHARS[b % RECOVERY_CHARS.length]).join('');
  return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
}

// Sessions: localStorage when "remember me" is on, otherwise sessionStorage
function currentSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    const s = raw ? JSON.parse(raw) : null;
    const acct = s ? api.findAccount(s.username) : null;
    return acct && !acct.banned ? s : null;
  } catch (e) { return null; }
}

function startSession(username, remember) {
  endSession();
  try {
    (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify({ username, t: Date.now() }));
  } catch (e) { toast('Could not save your session in this browser', 'error'); }
}

function endSession() {
  try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
}

// Failed logins: 5 misses locks the key for 5 minutes, then longer each time (max 60)
function failsFor(key) { return store(FAILS_KEY, {})[key] || { n: 0, until: 0 }; }
function lockedMinutes(key) {
  const f = failsFor(key);
  return f.until > Date.now() ? Math.ceil((f.until - Date.now()) / 60000) : 0;
}
function recordFail(key) {
  const all = store(FAILS_KEY, {});
  const n = (all[key] ? all[key].n : 0) + 1;
  all[key] = { n, until: n >= 5 ? Date.now() + Math.min(60, (n - 4) * 5) * 60000 : 0 };
  put(FAILS_KEY, all);
}
function clearFails(key) {
  const all = store(FAILS_KEY, {});
  delete all[key];
  put(FAILS_KEY, all);
}

function usernameProblem(u) {
  if (!u) return 'Pick a username';
  if (!isValidUsername(u)) return '3-20 letters, numbers, or underscores';
  if (ALWAYS_RESERVED.includes(u) || api.getSite().reserved.includes(u)) return 'That name is reserved';
  if (api.usernameTaken(u)) return 'That username is taken';
  return '';
}

function strengthOf(pw) {
  if (pw.length < 8) return { pct: Math.max(10, pw.length * 8), label: 'At least 8 characters' };
  let s = 0;
  if (pw.length >= 12) s++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if (/\d/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  if (s <= 1) return { pct: 35, label: 'Weak' };
  if (s === 2) return { pct: 60, label: 'Fair' };
  if (s === 3) return { pct: 80, label: 'Good' };
  return { pct: 100, label: 'Strong' };
}

async function loginFlow() {
  const err = $('auth-error');
  const ident = $('login-id').value.trim().toLowerCase();
  const pw = $('login-pw').value;
  const remember = $('login-remember').checked;
  err.textContent = '';
  if (!ident || !pw) { err.textContent = 'Enter your email or username and your password.'; return; }
  const mins = lockedMinutes(ident);
  if (mins) { err.textContent = `Too many failed attempts. Try again in ${mins} min.`; return; }
  const btn = $('login-go');
  if (btn) btn.disabled = true;
  try {
    const acct = api.findAccount(ident);
    const ok = acct ? await checkSecret(pw, acct.pw) : false;
    if (!ok) {
      recordFail(ident);
      const left = lockedMinutes(ident);
      err.textContent = left ? `Too many failed attempts. Try again in ${left} min.` : "That email or username and password don't match.";
      return;
    }
    if (acct.banned) { err.textContent = 'This account is banned.' + (acct.banReason ? ' Reason: ' + acct.banReason : ''); return; }
    clearFails(ident);
    acct.lastLogin = new Date().toISOString();
    api.saveAccounts(api.listAccounts().map((a) => (a.username === acct.username ? acct : a)));
    startSession(acct.username, remember);
    toast('Welcome back, @' + acct.username);
    location.hash = isStaffOrAdmin(acct) ? '#/admin' : '#/' + acct.username;
  } catch (e) {
    err.textContent = e.message || 'Something went wrong. Try again.';
  } finally {
    const b = $('login-go');
    if (b) b.disabled = false;
  }
}

async function signupFlow() {
  const err = $('auth-error');
  err.textContent = '';
  const username = $('su-username').value.trim().toLowerCase();
  const email = $('su-email').value.trim().toLowerCase();
  const pw = $('su-password').value;
  const pw2 = $('su-confirm').value;
  if (!api.getSite().signupsOpen) { err.textContent = 'Sign-ups are closed right now.'; return; }
  const problem = usernameProblem(username);
  if (problem) { err.textContent = problem; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
  if (api.emailTaken(email)) { err.textContent = 'That email already has an account.'; return; }
  if (pw.length < 8) { err.textContent = 'Your password needs at least 8 characters.'; return; }
  if (pw !== pw2) { err.textContent = "Passwords don't match."; return; }
  const btn = $('signup-go');
  if (btn) btn.disabled = true;
  try {
    const code = newRecoveryCode();
    const pwRec = await hashSecret(pw);
    const recRec = await hashSecret(code.replace(/-/g, ''));
    api.saveAccounts([...api.listAccounts(), {
      username, email, pw: pwRec, recovery: recRec, banned: false,
      createdAt: new Date().toISOString(), lastLogin: null
    }]);
    api.saveProfile(blankProfile(username));
    api.addLog('New account @' + username);
    pendingRecovery = { code, username };
    renderAuth('recovery');
  } catch (e) {
    err.textContent = e.message || 'Something went wrong. Try again.';
  } finally {
    const b = $('signup-go');
    if (b) b.disabled = false;
  }
}

function finishSignup() {
  const err = $('auth-error');
  if (!$('recovery-saved').checked) { err.textContent = 'Tick the box once you have saved the code.'; return; }
  const username = pendingRecovery.username;
  pendingRecovery = null;
  startSession(username, false);
  toast('Welcome, @' + username);
  location.hash = username === ADMIN_USERNAME ? '#/admin' : '#/' + username;
}

function copyRecovery() {
  const code = pendingRecovery ? pendingRecovery.code : '';
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(() => toast('Code copied')).catch(() => toast('Copy the code by hand', 'error'));
  } else {
    toast('Copy the code by hand', 'error');
  }
}

async function forgotFlow() {
  const err = $('auth-error');
  err.textContent = '';
  const ident = $('fg-id').value.trim().toLowerCase();
  const code = $('fg-code').value.replace(/[\s-]/g, '').toUpperCase();
  const pw = $('fg-password').value;
  const pw2 = $('fg-confirm').value;
  if (!ident || !code || !pw) { err.textContent = 'Fill in every field.'; return; }
  if (pw.length < 8) { err.textContent = 'Your new password needs at least 8 characters.'; return; }
  if (pw !== pw2) { err.textContent = "Passwords don't match."; return; }
  const key = 'reset:' + ident;
  const mins = lockedMinutes(key);
  if (mins) { err.textContent = `Too many attempts. Try again in ${mins} min.`; return; }
  const btn = $('forgot-go');
  if (btn) btn.disabled = true;
  try {
    const acct = api.findAccount(ident);
    const ok = acct ? await checkSecret(code, acct.recovery) : false;
    if (!ok) {
      recordFail(key);
      err.textContent = "That username and recovery code don't match.";
      return;
    }
    clearFails(key);
    acct.pw = await hashSecret(pw);
    api.saveAccounts(api.listAccounts().map((a) => (a.username === acct.username ? acct : a)));
    api.addLog('Password reset for @' + acct.username);
    toast('Password changed. Log in with your new password.');
    location.hash = '#/login';
  } catch (e) {
    err.textContent = e.message || 'Something went wrong. Try again.';
  } finally {
    const b = $('forgot-go');
    if (b) b.disabled = false;
  }
}

/* =========================================================================
   10c. ADMIN ACCOUNT, ACCOUNT MANAGEMENT, BADGE MIGRATION, ANNOUNCEMENTS
   Only the chexxk account can be admin. It's created once at #/setup with the
   setup passcode. Anyone can read this file, so the role check is a demo check.
   Real enforcement needs Supabase Row Level Security.
   ========================================================================= */
const ADMIN_USERNAME = 'chexxk';
const BADGE_SEEN_KEY = 'chexxk-badge-seen';
const selectedSet = new Set();
let tempReset = null;
let logQuery = '';

// Roles: admin (full access), staff (moderation), user (no admin access).
// The chexxk account is always admin.
const PERMS = {
  admin: ['moderate', 'roles', 'delete', 'reset', 'badges', 'rules', 'site', 'backup', 'audit'],
  staff: ['moderate']
};

function roleOf(acct) {
  if (!acct) return 'user';
  if (acct.username === ADMIN_USERNAME) return 'admin';
  return acct.role === 'admin' || acct.role === 'staff' ? acct.role : 'user';
}

function isAdminAccount(acct) { return roleOf(acct) === 'admin'; }
function isStaffOrAdmin(acct) { const r = roleOf(acct); return r === 'admin' || r === 'staff'; }

function currentAccount() {
  const s = currentSession();
  return s ? api.findAccount(s.username) : null;
}

function can(perm) {
  const acct = currentAccount();
  return !!acct && (PERMS[roleOf(acct)] || []).includes(perm);
}

function allowed(perm) {
  if (can(perm)) return true;
  toast('Your role cannot do that', 'error');
  return false;
}

function isAdminSession() { return isStaffOrAdmin(currentAccount()); }

function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString() : 'unknown'; }

// A banned user who is still logged in gets logged out and told why
function noticeIfBannedSession() {
  let raw = null;
  try { raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY); } catch (e) { raw = null; }
  let s = null;
  try { s = raw ? JSON.parse(raw) : null; } catch (e) { s = null; }
  const acct = s ? api.findAccount(s.username) : null;
  if (acct && acct.banned) {
    endSession();
    toast('Your account is banned' + (acct.banReason ? ': ' + acct.banReason : '.'), 'error');
  }
}

function renderSuspended(p) {
  setMeta(`@${p.username} is suspended · ${api.getSite().name}`, 'This profile is suspended', '');
  app.innerHTML = `

      <p class="label">Suspended</p>
      <h1 class="page-title">@${esc(p.username)} is suspended</h1>
      <p class="muted">${p.banReason ? 'Reason: ' + esc(p.banReason) : 'This profile has been suspended by the team.'}</p>
      <div class="row-end"><a class="btn ghost" href="#/explore">Explore</a><a class="btn" href="#/">Home</a></div>
    </div>`;
}

function makeTempPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => chars[b % chars.length]).join('');
}

// Adds new built-in badges to saved lists once. A badge an admin deleted stays deleted.
function migrateBadges() {
  let stored = store(KEYS.badges, null);
  let seen = store(BADGE_SEEN_KEY, null);
  if (stored === null) {
    stored = BADGE_SEED.map((b) => Object.assign({}, b));
    seen = BADGE_SEED.map((b) => b.id);
  } else {
    if (seen === null) seen = stored.map((b) => b.id);
    const have = new Set(stored.map((b) => b.id));
    BADGE_SEED.forEach((seedBadge) => {
      if (!have.has(seedBadge.id) && !seen.includes(seedBadge.id)) stored.push(Object.assign({}, seedBadge));
    });
    seen = [...new Set([...seen, ...BADGE_SEED.map((b) => b.id)])];
  }
  stored = stored.map((b, i) => {
    const fixed = Object.assign({ icon: 'tag', color: '#3b82ff', tooltip: b.label || '', order: i + 1 }, b);
    if (fixed.id === 'verified' && fixed.manualOnly === undefined) fixed.manualOnly = true;
    return fixed;
  });
  put(KEYS.badges, stored);
  put(BADGE_SEEN_KEY, seen);
}

function bulkApply() {
  const action = $('bulk-action').value;
  if ((action === 'hide' || action === 'show') && !allowed('moderate')) return;
  if ((action.startsWith('give:') || action.startsWith('take:')) && !allowed('badges')) return;
  if (!selectedSet.size) { toast('Select at least one profile', 'error'); return; }
  const profiles = api.listProfiles();
  let n = 0;
  profiles.forEach((p) => {
    if (!selectedSet.has(p.username)) return;
    if (action === 'hide') { p.hidden = true; n++; }
    else if (action === 'show') { if (!p.banned) p.hidden = false; n++; }
    else if (action.startsWith('give:')) {
      const id = action.slice(5);
      if (!p.badges.includes(id)) p.badges = [...p.badges, id];
      n++;
    } else if (action.startsWith('take:')) {
      const id = action.slice(5);
      p.badges = p.badges.filter((x) => x !== id);
      n++;
    }
  });
  api.saveAllProfiles(profiles);
  api.addLog(`Bulk "${action}" on ${n} profile(s)`);
  selectedSet.clear();
  toast(`Updated ${n} profile(s)`);
  renderAdminPane();
}

function setAccountBanned(u, banned, reason) {
  if (!allowed('moderate')) return;
  if (u === ADMIN_USERNAME) { toast('The chexxk account cannot be banned', 'error'); return; }
  const accounts = api.listAccounts();
  const acct = accounts.find((a) => a.username === u);
  if (acct && roleOf(acct) !== 'user' && !can('roles')) {
    toast('Only admins can ban or unban staff or admins', 'error');
    return;
  }
  const actor = currentAccount();
  const note = String(reason || '').trim().slice(0, 200) || (banned ? 'No reason given' : '');
  const p = api.getProfile(u);
  if (!acct && !p) { toast(`No account or profile named @${u}`, 'error'); return; }
  if (acct) {
    acct.banned = banned;
    acct.banReason = banned ? note : '';
    acct.bannedBy = actor ? actor.username : 'system';
    acct.bannedAt = banned ? new Date().toISOString() : null;
    api.saveAccounts(accounts);
  }
  if (p) {
    p.banned = banned;
    p.banReason = banned ? note : '';
    p.hidden = banned;
    api.saveProfile(p);
  }
  api.addLog(banned ? `Banned @${u}: ${note}` : `Unbanned @${u}`);
  toast(banned ? `Banned @${u}` : `Unbanned @${u}`);
  renderAdminPane();
}

function addAccountNote(u, text) {
  if (!allowed('moderate')) return;
  const clean = String(text || '').trim().slice(0, 300);
  if (!clean) { toast('Write a note first', 'error'); return; }
  const accounts = api.listAccounts();
  const acct = accounts.find((a) => a.username === u);
  if (!acct) { toast('That profile has no account to note', 'error'); return; }
  const who = currentAccount();
  acct.notes = [...(acct.notes || []), { by: who ? who.username : 'system', t: new Date().toISOString(), text: clean }].slice(-20);
  api.saveAccounts(accounts);
  api.addLog(`Added a note on @${u}`);
  toast('Note saved');
  renderAdminPane();
}

async function resetAccountPassword(u) {
  if (!allowed('reset')) return;
  const accounts = api.listAccounts();
  const acct = accounts.find((a) => a.username === u);
  if (!acct) return;
  const temp = makeTempPassword();
  try {
    acct.pw = await hashSecret(temp);
  } catch (e) {
    toast(e.message, 'error');
    return;
  }
  api.saveAccounts(accounts);
  clearFails(u);
  tempReset = { u, pw: temp };
  api.addLog('Reset password for @' + u);
  renderAdminPane();
}

function deleteAccount(u) {
  if (!allowed('delete')) return;
  if (u === ADMIN_USERNAME) { toast('The chexxk account cannot be deleted', 'error'); return; }
  api.saveAccounts(api.listAccounts().filter((a) => a.username !== u));
  api.deleteProfile(u);
  if (tempReset && tempReset.u === u) tempReset = null;
  api.addLog('Deleted account @' + u);
  toast(`Deleted @${u}`);
  renderAdminPane();
}
